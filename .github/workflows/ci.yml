name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Quick start (stub provider, no API key)
        run: |
          regressguard \
            --prompt "{{input}}" \
            --cases examples/quickstart-cases.json \
            --provider stub \
            --stub-responses examples/quickstart-stub-responses.json \
            --out report.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t regressguard:ci .
      - name: Quick start in the container
        run: |
          docker run --rm -v "$PWD/examples:/examples:ro" regressguard:ci \
            regressguard \
              --prompt "{{input}}" \
              --cases /examples/quickstart-cases.json \
              --provider stub \
              --stub-responses /examples/quickstart-stub-responses.json
      - name: Server health check
        run: |
          docker run -d --name rg -p 8787:8787 regressguard:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8787/health && exit 0
            sleep 1
          done
          docker logs rg
          exit 1
